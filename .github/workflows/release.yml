# .github/workflows/release.yml

name: Build and Push Docker Image

# 工作流程的觸發條件
on:
  push:
    # 只有當一個以 'v' 開頭的 tag 被推送到倉庫時，才觸發此流程
    # 例如：v1.0.0, v1.2.3-beta
    tags:
      - 'v*'
  # 允許手動觸發門禁（不推送鏡像）
  workflow_dispatch:

# 權限設置，允許工作流程創建 GitHub Release
permissions:
  contents: write

env:
  # block = 門禁失敗即阻斷；warn = 僅告警（僅供應急，倉庫變數 CVE_GATE_MODE 控制）
  CVE_GATE_MODE: ${{ vars.CVE_GATE_MODE || 'block' }}
  GATE_IMAGE: php-cve-gate:local

jobs:
  # CVE-2026-109618 / CVE-2026-109619 (PHP2Shell) 發布門禁
  # 見 scripts/cve-gate.php 與 scripts/oom-semantics.php
  security-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for verification (amd64, local)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: ${{ env.GATE_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Gate L0/L1 — 版本與配置
        run: |
          docker run --rm \
            -e CVE_GATE_MODE="$CVE_GATE_MODE" \
            -v "${{ github.workspace }}/scripts:/gate:ro" \
            "$GATE_IMAGE" php /gate/cve-gate.php

      - name: Gate L2 — OOM 語義回歸
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/scripts:/gate:ro" \
            "$GATE_IMAGE" php /gate/oom-semantics.php

  php-fpm-release:
    needs: security-gate
    # 手動觸發只跑門禁，不推送鏡像
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      # 第一步：檢出你的代碼
      - name: Checkout code
        uses: actions/checkout@v4

      # 第二步：登錄 Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 第三步：設置 Docker Buildx
      - name: Set up Docker Buildx  # 支援多平台建置
        uses: docker/setup-buildx-action@v3

      # 第四步：建置並推送 Docker 鏡像
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .  # 建置上下文（包含Dockerfile的目錄）
          push: true  # 推送至Docker Hub
          platforms: linux/amd64,linux/arm64  # 只構建 amd64 和 arm64 架構
          tags: ${{ secrets.DOCKERHUB_TEAM }}/php-docker:8.0-fpm
          cache-from: type=gha  # 使用GitHub Actions快取加速建置
          cache-to: type=gha,mode=max
