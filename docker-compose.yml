version: "3"
services:
  php:
    image: "mmhk/php-docker:8.0-fpm"
    volumes:
      - ../:/var/www
      - ./.:/var/www/html
    environment:
      WWW_UID: 1000
      WWW_GID: 1000
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
  caddy:
    depends_on:
      - php
    image: "mmhk/php-docker:fpm-caddy-2.6.2"
    environment:
      - TZ=Asia/Hong_Kong
    volumes:
      - ../:/var/www
      - ./.:/var/www/html
    links:
      - "php"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"