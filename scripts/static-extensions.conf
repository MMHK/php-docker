# 靜態內嵌擴充對照表：<ext-name><TAB><configure flags>
# 由 scripts/build-php-static.sh 與 docker-php-ext-static-install 共用。
# 不在本表的擴充，docker-php-ext-static-install 會嘗試從 config.m4 推導，
# 或要求以 --configure-args 指定。
bcmath	--enable-bcmath
bz2	--with-bz2
exif	--enable-exif
ffi	--with-ffi
gd	--enable-gd --with-jpeg --with-freetype --with-webp --with-xpm
gettext	--with-gettext
mysqli	--with-mysqli=mysqlnd
pdo_mysql	--with-pdo-mysql=mysqlnd
soap	--enable-soap
sockets	--enable-sockets
zip	--with-zip
snmp	--with-snmp
shmop	--enable-shmop
memcached	--enable-memcached --with-libmemcached-dir=/usr --enable-memcached-json --enable-memcached-sasl
imagick	--with-imagick
mcrypt	--with-mcrypt
redis	--enable-redis --enable-redis-lz4 --with-liblz4 --enable-redis-zstd --with-libzstd
timezonedb	--enable-timezonedb
